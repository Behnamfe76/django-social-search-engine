; Two processes in one container: the web app and the Celery worker.
;
; They are deliberately together. The importer writes uploads to MEDIA_ROOT and
; the worker reads byte ranges back out of them, so the two have to share a
; filesystem. Splitting them into separate containers is the production move --
; and it is exactly the point at which DEFAULT_FILE_STORAGE has to become S3
; rather than local disk.
;
; Both programs log to the container's stdout so `docker compose logs` and
; `./sse logs` show them interleaved. Rotation is off (maxbytes=0) because the
; Docker log driver already handles it.
;
; The commands are thin scripts under docker/, which read their options from
; the environment. They live under the bind mount, so changing how a process
; starts needs a restart rather than a rebuild -- unlike this file, which is
; copied into the image.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:web]
command=/app/docker/web.sh
directory=/app
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=10

[program:worker]
; Chunk tasks are idempotent, so a TERM mid-flight is safe: whatever did not
; commit is simply re-claimed on redelivery.
command=/app/docker/worker.sh
directory=/app
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=20
